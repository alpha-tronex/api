name: CI/CD

# One pipeline, no branches needed:
#   every push / PR  → checks (lint, typecheck, tests)
#   push to main     → checks → deploy to Vercel production → smoke test
# Production only changes when the checks pass. Vercel's own Git auto-deploy
# is turned off for `main` in vercel.json, so this workflow is the only thing
# that deploys production. Set up with the `cicd-pipeline` skill.

on:
  pull_request:
  push:
    branches: [main]
  # Manual re-run of the whole pipeline from the Actions tab.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but never cancel a run on main part-way
  # through a production deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Every check below runs even if an earlier one fails (`!cancelled()`),
      # so a run shows all problems at once instead of one per push.
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      # `next typegen` writes next-env.d.ts and route types (both gitignored)
      # before tsc runs, so CI sees the same types as a local build.
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm test

  deploy:
    name: Deploy to Vercel (production)
    needs: checks
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One production deploy at a time, in push order.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PRODUCTION_URL: https://language-translator-apivercelapp.vercel.app
    steps:
      - name: Check deploy secrets are configured
        run: |
          missing=""
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secret(s):$missing — add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pinned so a CLI release can't change deploy behavior unannounced.
      - name: Install Vercel CLI
        run: npm install --global vercel@60.1.3

      # Downloads production env vars and project settings into .vercel/
      # so the build below matches what Vercel would have built.
      - name: Pull Vercel production settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output to production
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed: $url"
          echo "### Deployed to production" >> "$GITHUB_STEP_SUMMARY"
          echo "$url → $PRODUCTION_URL" >> "$GITHUB_STEP_SUMMARY"

      # Proves the new production deployment serves pages and API routes.
      # POST {} to /api/translate is rejected with 400 before any OpenAI
      # call, so this costs nothing. Retries cover alias propagation.
      - name: Smoke test production
        run: |
          check() {  # $1 = expected status, rest = curl args
            local want=$1; shift
            for attempt in 1 2 3 4 5 6; do
              got=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$@") || got=000
              [ "$got" = "$want" ] && { echo "OK $want: $*"; return 0; }
              echo "Attempt $attempt: got $got, want $want — retrying in 10s"
              sleep 10
            done
            echo "::error::Smoke test failed: expected $want from $*, got $got"
            return 1
          }
          check 200 "$PRODUCTION_URL/privacy"
          check 400 -X POST "$PRODUCTION_URL/api/translate" \
            -H 'Content-Type: application/json' -d '{}'
